name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm run install:ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:smoke
      - run: npm audit --audit-level=high

  backend-migration:
    name: Backend migration smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: katilim_finans_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-password-2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d katilim_finans_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      POSTGRES_DB: katilim_finans_test
      POSTGRES_ADMIN_USER: postgres
      POSTGRES_ADMIN_PASSWORD: ci-admin-password-2026
      DB_MIGRATOR_USER: hititfinlex_migrator
      DB_MIGRATOR_PASSWORD: ci-migrator-password-2026
      DB_USER: hititfinlex_app
      DB_PASSWORD: ci-runtime-password-2026
      DATABASE_URL: postgresql://hititfinlex_migrator:ci-migrator-password-2026@127.0.0.1:5432/katilim_finans_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt
      - run: python -m pip install -r backend/requirements-ci.txt
      - run: python backend/db/migrate.py check
      - run: python backend/db/provision.py all
      - run: python backend/db/migrate.py smoke
      - run: python -m unittest discover -s backend/tests -p "test_*.py"
      - run: python -m unittest -v test_backend_hardening.py
        working-directory: backend
      - run: python -m compileall -q backend

  production-container:
    name: Production container (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t hititfinlex-frontend:ci .
      - run: docker run --rm --entrypoint node hititfinlex-frontend:ci -e "import('vinext/server/prod-server').then(()=>console.log('production runtime ok'))"
